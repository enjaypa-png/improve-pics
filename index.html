<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etsy Image Optimizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Etsy Image Optimizer</h1>
        <div class="header-controls">
            <div class="photo-count-indicator">
                <span id="photoCount">0</span> photos
                <span id="photoCountStatus" class="status-badge"></span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Upload Section -->
        <section id="uploadSection" class="upload-section">
            <div class="section-header">
                <h2>Upload Images</h2>
                <button id="addImagesBtn" class="btn-primary">
                    <span>+</span> Add Images (Max 10)
                </button>
                <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/gif" multiple hidden>
            </div>
            <div id="uploadedImages" class="images-grid">
                <div class="empty-state">
                    <p>Upload 1-10 images to get started</p>
                    <p class="empty-state-hint">First image will be optimized as thumbnail (1:1), rest as supporting images (4:3)</p>
                </div>
            </div>
            <div id="uploadActions" class="upload-actions" style="display: none;">
                <button id="optimizeBtn" class="btn-optimize">Optimize Images for Etsy</button>
            </div>
        </section>

        <!-- Optimized Images Section -->
        <section id="optimizedSection" class="optimized-section" style="display: none;">
            <div class="section-header">
                <h2>Optimized Images</h2>
                <button id="downloadAllBtn" class="btn-secondary">Download All</button>
            </div>
            <div id="optimizedImages" class="optimized-grid">
                <!-- Optimized images will appear here -->
            </div>
        </section>
    </main>

    <!-- Full-Screen Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <button class="modal-nav modal-nav-prev">&larr;</button>
            <button class="modal-nav modal-nav-next">&rarr;</button>
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="Full view">
            </div>
            <div id="modalSummary" class="modal-summary">
                <!-- Optimization summary will appear here -->
            </div>
            <div class="modal-actions">
                <button id="modalDownload" class="btn-primary">Download</button>
            </div>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator">
        <div class="spinner"></div>
        <p id="loadingText">Processing...</p>
    </div>

    <!-- App Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
